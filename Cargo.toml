[workspace]
members = [
    "crates/cerebro",
    "crates/cerebro-mcp",
    "crates/cerebro-api",
    "crates/cerebro-cli",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
authors     = ["buckster123"]
edition     = "2021"
license     = "MIT"
repository  = "https://github.com/buckster123/CerebroCortex-RS"

[workspace.dependencies]
# Filesystem dirs
dirs-next   = "2"
# Temp dirs for tests
tempfile    = "3"
subtle      = "2"

# Async
tokio       = { version = "1", features = ["full"] }
# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# Storage
rusqlite    = { version = "0.31", features = ["bundled", "blob"] }
sqlite-vec  = "0.1"
# Graph
petgraph    = "0.6"
# Embeddings (ONNX, no GPU required)
fastembed   = "4"
# HTTP client (Anthropic API, dream engine LLM calls)
reqwest     = { version = "0.12", features = ["json"] }
# Web framework (cerebro-api)
axum        = "0.7"
tower       = "0.4"
tower-http  = { version = "0.6", features = ["catch-panic"] }
# CLI
clap        = { version = "4", features = ["derive", "env"] }
# UUIDs
uuid        = { version = "1", features = ["v4", "serde"] }
# Time
chrono      = { version = "0.4", features = ["serde"] }
# Error handling
anyhow      = "1"
thiserror   = "1"
# Logging/tracing
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
# Random (ACT-R noise)
rand        = "0.8"
# File watching
notify      = "6"
# Benchmarking
criterion   = { version = "0.5", features = ["html_reports"] }


[profile.release]
opt-level   = 3
lto         = "thin"
strip       = true

[profile.dev]
opt-level   = 0
debug       = true
